# Clippy configuration for the Soroban smart-contract workspace.
#
# Exception rationale
# ────────────────────
# Soroban SDK boilerplate (contract macros, no_std, symbol_short!, Address,
# Env, etc.) unavoidably triggers several clippy lints that would otherwise
# indicate a code-smell in a conventional Rust codebase. These exceptions
# document which rules are intentionally relaxed and why.
#
# ── Rules ──────────────────────────────────────────────────────────────

# Soroban `#[contract]` and `#[contractimpl]` generate items that are
# never directly called by user-code (the SDK routes through its own
# dispatch), so clippy cannot see their call-sites.
#
# Affected patterns:
#   `pub struct MyContract;` (unit struct used as namespace)
#   Generated `__check_auth` / `__constructor` functions
#   Module-level `__register_contract` functions
too-many-arguments = false

# Contract public functions regularly need 8+ parameters (admin, token,
# borrower, amount, etc.) because Soroban passes all arguments explicitly
# rather than bundling them into a config struct.
too-many-arguments = false

# `no_std` prevents using the standard library prelude, which triggers
# `unused_imports` warnings when importing traits from `soroban-sdk`.
# The `Vec`, `Address`, `Symbol`, `BytesN` etc. imports are required for
# the contract ABI but may appear unused to static analysis.
unused-imports = false

# Soroban `Vec<T>` and `BytesN<32>` in enums like `DataKey` trigger
# `large_enum_variant` because the SDK requires these types to be stored
# inline. This size is necessary for on-chain storage layout.
large-enum-variant = false

# Contract error enums are used as `Result<_, ContractError>` return types.
# The SDK serialises them; the size is not a performance concern.
result-large-err = false

# The `#[allow(dead_code)]` attribute is used on some constant definitions
# (e.g. legacy fee constants that are retained for documentation purposes
# even if no longer referenced in the current code path).
#
# Where practical, annotate the specific item with
# `#[allow(dead_code)]` directly rather than suppressing the lint
# workspace-wide.
# dead-code is already allowed at the crate level where needed.

# Allow `let_and_return` for Soroban contract entry-points where the
# compiler prefers an explicit named return value for clarity in the
# generated metadata.
let-and-return = false

# Allow large `Result` types in Soroban contract methods where the
# size comes from SDK types rather than developer logic.
result-large-err = false

# Allow `module_name_repetitions` because Soroban convention names
# types like `PoolError`, `DataKey`, etc. inside modules named after
# the contract.
module-name-repetitions = false

# Allow `type_complexity` in function signatures where Soroban ABI
# requires nested generic types like `Result<Vec<Address>, Error>`.
type-complexity = false

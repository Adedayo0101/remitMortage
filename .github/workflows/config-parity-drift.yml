name: Environment Config Parity Drift

# Compares non-secret configuration, versions and feature-flag states between
# staging and production on a schedule, ignoring differences listed in
# devops/config-parity-allowlist.json. New unexpected drift alerts the team and
# opens an issue; first-seen/resolved times are kept on the
# `config-drift-history` branch. Issue #931. See docs/CONFIG_PARITY_DRIFT.md.

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/config-parity-drift.mjs"
      - "scripts/config-parity-drift.test.mjs"
      - "scripts/fixtures/config-parity/**"
      - "devops/config-parity-allowlist.json"
      - ".github/workflows/config-parity-drift.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Parity logic tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: node --test scripts/config-parity-drift.test.mjs

  collect:
    name: Collect ${{ matrix.environment }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Collect snapshot
        run: node scripts/config-parity-drift.mjs collect --environment "${{ matrix.environment }}" --out "${{ matrix.environment }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-snapshot-${{ matrix.environment }}
          path: ${{ matrix.environment }}.json
          retention-days: 7

  compare:
    name: Compare and alert
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: parity-snapshot-*
          merge-multiple: true

      # History lives on its own branch so it survives cache eviction.
      - name: Fetch drift history
        run: |
          mkdir -p history
          if git ls-remote --exit-code --heads origin config-drift-history >/dev/null 2>&1; then
            git fetch --depth=1 origin config-drift-history
            git show FETCH_HEAD:history.json > history/history.json 2>/dev/null || echo '{"drift":{}}' > history/history.json
          else
            echo '{"drift":{}}' > history/history.json
          fi

      - name: Compare environments
        id: compare
        run: |
          set +e
          node scripts/config-parity-drift.mjs compare \
            --staging staging.json --production production.json \
            --history history/history.json --report parity-report.md
          code=$?
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ] || exit "$code"

      - name: Save drift history
        run: |
          cd history
          git init -q
          git checkout -q -b config-drift-history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -q -m "chore: update config drift history" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" config-drift-history

      - name: Alert on new drift
        if: steps.compare.outputs.new_drift == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DEVOPS_ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "DEVOPS_ALERT_WEBHOOK_URL not set; skipping chat notification."; exit 0; fi
          PAYLOAD=$(jq -n --arg run "$RUN_URL" --arg report "$(cat parity-report.md)" \
            '{text: ("⚠️ *Staging/production config drift detected*\n" + $run + "\n\n" + $report)}')
          curl -sf -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL"

      - name: Open GitHub issue on new drift
        if: steps.compare.outputs.new_drift == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('parity-report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Drift] Unexpected staging/production config difference',
              body: report + '\nIf a difference is intentional, add it to `devops/config-parity-allowlist.json`; otherwise align the environments.\n\nRun: ' + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['drift', 'needs-review'],
            });

      - name: Fail the run while unexpected drift exists
        if: steps.compare.outputs.drift == 'true'
        run: |
          echo "::error::Unexpected configuration drift between staging and production. See the run summary."
          exit 1

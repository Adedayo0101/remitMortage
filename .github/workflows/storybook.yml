name: Storybook

on:
  pull_request:
    branches: [main, development]
    paths:
      - "frontend/**"
      - "docs/STORYBOOK.md"
      - ".github/workflows/storybook.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/STORYBOOK.md"
      - ".github/workflows/storybook.yml"

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Storybook build and accessibility tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Storybook stories and accessibility checks
        run: npm run test:storybook
      - name: Build static Storybook
        run: npm run build-storybook
      - name: Upload pull-request preview artifact
        id: preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-preview-pr-${{ github.event.pull_request.number }}
          path: frontend/storybook-static/
          if-no-files-found: error
          retention-days: 14
      - name: Link preview artifact
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Storybook preview"
            echo
            echo "Static preview build for PR #${PR_NUMBER}: [download the artifact](${PREVIEW_URL})."
            echo "Extract it and serve the \`storybook-static\` folder locally to review the catalog."
          } >> "$GITHUB_STEP_SUMMARY"

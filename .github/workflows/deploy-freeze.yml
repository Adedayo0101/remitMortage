name: Deployment Freeze Windows

# Validates the version-controlled freeze calendar, tests the gate logic, and
# announces upcoming freezes in the team channel (issue #930). The gate itself
# runs inside blue-green-deploy.yml.

on:
  pull_request:
    paths:
      - "devops/deploy-freeze-calendar.json"
      - "scripts/deploy-freeze-gate.mjs"
      - "scripts/deploy-freeze-gate.test.mjs"
      - ".github/workflows/deploy-freeze.yml"
      - ".github/workflows/blue-green-deploy.yml"
  schedule:
    # Weekdays 09:00 UTC
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Calendar validation and gate tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Validate calendar
        run: node scripts/deploy-freeze-gate.mjs validate
      - name: Run unit tests
        run: node --test scripts/deploy-freeze-gate.test.mjs

  announce:
    name: Announce upcoming freezes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FREEZE_ANNOUNCE_HOURS: "72"
      DEVOPS_ALERT_WEBHOOK_URL: ${{ secrets.DEVOPS_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: node scripts/deploy-freeze-gate.mjs announce

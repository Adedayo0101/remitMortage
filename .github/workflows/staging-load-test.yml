name: Staging Load Testing (k6)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bulk-approval-staging-load-test:
    name: Run concurrent admin bulk approval load test
    runs-on: ubuntu-latest
    # Needs a live staging API. The secrets context cannot be read in a step
    # `if`, so expose only whether the credentials are configured.
    env:
      STAGING_CONFIGURED: ${{ secrets.STAGING_ADMIN_JWT != '' && secrets.BULK_APPROVAL_APPLICATION_IDS != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Skip load test (staging credentials not configured)
        if: env.STAGING_CONFIGURED != 'true'
        run: echo "STAGING_ADMIN_JWT / BULK_APPROVAL_APPLICATION_IDS are not set; skipping the staging load test."

      - name: Run concurrent bulk approval test
        if: env.STAGING_CONFIGURED == 'true'
        working-directory: backend
        run: npm run load-test:bulk-approval
        env:
          BASE_URL: ${{ secrets.STAGING_URL || 'https://staging-api.remitmortgage.com' }}
          ADMIN_JWT: ${{ secrets.STAGING_ADMIN_JWT }}
          BULK_APPROVAL_APPLICATION_IDS: ${{ secrets.BULK_APPROVAL_APPLICATION_IDS }}
          LOAD_CONNECTIONS: 10
          LOAD_DURATION: 30
          LOAD_P99_THRESHOLD_MS: 500
          LOAD_MAX_ERROR_RATE: 0.01

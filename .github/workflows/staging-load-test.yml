name: Staging Load Testing (k6)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  k6-staging-load-test:
    name: Run k6 Load Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run k6 Staging Load Test
        uses: grafana/k6-action@v0.4.0
        with:
          filename: tests/load/k6-load-test.js
          flags: --summary-export=k6-summary.json
        env:
          STAGING_URL: ${{ secrets.STAGING_URL || 'https://staging-api.remitmortgage.com' }}

      - name: Generate Readable Summary Report
        if: always()
        run: |
          echo "## 🚀 k6 Staging Load Test Summary Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f k6-summary.json ]; then
            echo "### 📊 Performance & Threshold Metrics" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value | Threshold / Status |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            
            # Extract key values using node
            node -e '
              const fs = require("fs");
              try {
                const summary = JSON.parse(fs.readFileSync("k6-summary.json", "utf8"));
                const metrics = summary.metrics || {};
                
                const reqs = metrics.http_reqs ? metrics.http_reqs.values.count : "N/A";
                const p95 = metrics.http_req_duration ? metrics.http_req_duration.values["p(95)"].toFixed(2) + " ms" : "N/A";
                const p99 = metrics.http_req_duration ? metrics.http_req_duration.values["p(99)"].toFixed(2) + " ms" : "N/A";
                const avg = metrics.http_req_duration ? metrics.http_req_duration.values.avg.toFixed(2) + " ms" : "N/A";
                const failedRate = metrics.http_req_failed ? (metrics.http_req_failed.values.rate * 100).toFixed(2) + "%" : "N/A";
                
                console.log(`| Total Requests | ${reqs} | - |`);
                console.log(`| Avg Latency | ${avg} | - |`);
                console.log(`| p95 Latency | **${p95}** | ${metrics.http_req_duration.thresholds ? "p(95)<500ms" : "Target: <500ms"} |`);
                console.log(`| p99 Latency | ${p99} | - |`);
                console.log(`| Error Rate | ${failedRate} | Target: <1.0% |`);
              } catch (err) {
                console.log("| Report Status | Failed to parse JSON summary | ❌ |");
              }
            ' >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **Note:** If p95 latency exceeds 500ms or error rate exceeds 1%, the pipeline will fail to prevent performance regressions." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ `k6-summary.json` was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive Load Test Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-staging-load-test-summary
          path: k6-summary.json
          retention-days: 14

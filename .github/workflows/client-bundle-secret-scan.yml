name: Client Bundle Secret Scan

# Anything bundled into the frontend is public. This builds the frontend with
# browser source maps and fails when the bundle or its maps contain secret-like
# strings or known key formats outside the reviewed allowlist, when the value of
# a server-only secret ends up in the bundle, or when a variable without the
# NEXT_PUBLIC_ prefix is exposed to the client. Issue #933.
# See docs/CLIENT_BUNDLE_SECRET_SCAN.md.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, development ]
    paths:
      - "frontend/**"
      - "scripts/client-bundle-secret-scan.mjs"
      - "scripts/client-bundle-secret-scan.test.mjs"
      - "devops/client-bundle-secret-allowlist.json"
      - ".github/workflows/client-bundle-secret-scan.yml"

permissions:
  contents: read

jobs:
  scanner-tests:
    name: Scanner tests (planted secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node --test scripts/client-bundle-secret-scan.test.mjs

  scan:
    name: Scan built client bundle
    needs: scanner-tests
    runs-on: ubuntu-latest
    env:
      # Server-only canary: if its value ever shows up in the bundle, the
      # env-leak check fails, proving server secrets are not being inlined.
      CLIENT_SCAN_CANARY_SECRET: canary-${{ github.run_id }}-${{ github.run_attempt }}-7f3a9c1e5b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: frontend
      - name: Build Next.js Application (with source maps for scanning)
        run: npm run build
        working-directory: frontend
        env:
          CLIENT_BUNDLE_SOURCEMAPS: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CAWXDSZM52E5BW7G6TFX7DTXSHF7F75TUSSWW7B442NBEU3CADXNVTXH
          NEXT_PUBLIC_LENDING_POOL_CONTRACT_ID: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
          NEXT_PUBLIC_USDC_TOKEN_ID: CCERWUE35WN7M4PN6XYK7CDCJZX35TC53TFATJNBRA6I3FDS3RVS65YF
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_HORIZON_URL: "https://horizon-testnet.stellar.org"
      - name: Scan client bundle for secrets
        run: node scripts/client-bundle-secret-scan.mjs --report client-bundle-secret-scan.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: client-bundle-secret-scan
          path: client-bundle-secret-scan.md
          retention-days: 14
          if-no-files-found: ignore

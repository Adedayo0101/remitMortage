name: SBOM Diff Comment

# Posts a single, updating comment on pull requests that change dependencies:
# added / removed / upgraded packages with licenses, flagging disallowed
# licenses (scripts/license-allowlist.json) and known vulnerabilities (OSV).
# Issue #929.

on:
  pull_request:
    paths:
      - "backend/package.json"
      - "backend/package-lock.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "contracts/Cargo.toml"
      - "contracts/Cargo.lock"
      - "scripts/sbom-diff.mjs"
      - "scripts/license-allowlist.json"
      - ".github/workflows/sbom-diff.yml"

permissions:
  contents: read

concurrency:
  group: sbom-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: SBOM diff logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: node --test scripts/sbom-diff.test.mjs

  sbom-diff:
    name: Compare PR SBOM with base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: head
      - name: Checkout base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: SBOM (base) backend
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { path: ./base/backend, format: spdx-json, output-file: base-backend.spdx.json, upload-artifact: false }
      - name: SBOM (head) backend
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { path: ./head/backend, format: spdx-json, output-file: head-backend.spdx.json, upload-artifact: false }
      - name: SBOM (base) frontend
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { path: ./base/frontend, format: spdx-json, output-file: base-frontend.spdx.json, upload-artifact: false }
      - name: SBOM (head) frontend
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { path: ./head/frontend, format: spdx-json, output-file: head-frontend.spdx.json, upload-artifact: false }
      - name: SBOM (base) contracts
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { path: ./base/contracts, format: spdx-json, output-file: base-contracts.spdx.json, upload-artifact: false }
      - name: SBOM (head) contracts
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { path: ./head/contracts, format: spdx-json, output-file: head-contracts.spdx.json, upload-artifact: false }

      - name: Compute SBOM diff
        id: diff
        # Run the script from the PR head so changes to it are exercised.
        run: |
          node head/scripts/sbom-diff.mjs --out sbom-diff-comment.md \
            backend=base-backend.spdx.json:head-backend.spdx.json \
            frontend=base-frontend.spdx.json:head-frontend.spdx.json \
            contracts=base-contracts.spdx.json:head-contracts.spdx.json
          cat sbom-diff-comment.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR: found by its hidden marker and edited in place.
      # Fork PRs get a read-only token, so there the summary above is the output.
      - name: Create or update PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('sbom-diff-comment.md', 'utf8');
            const marker = '<!-- sbom-diff-comment -->';
            const changed = '${{ steps.diff.outputs.changed }}' === 'true';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else if (changed) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
